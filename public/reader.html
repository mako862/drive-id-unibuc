<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Cititor document — Drept UniBuc</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #0f172a; display: flex; flex-direction: column; }
        header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e8f0; flex: 0 0 auto; }
        header a { color: #2563eb; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
        header h1 { font-size: 15px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        main { flex: 1 1 auto; min-height: 0; padding: 12px; }
        #reader { height: 100%; }
        .document-reader p, .document-reader ul, .document-reader ol { margin-bottom: 1em; }
        .document-reader h1, .document-reader h2, .document-reader h3 { font-weight: 700; margin: 1em 0 .5em; }
        .document-reader h1 { font-size: 1.75em; }
        .document-reader h2 { font-size: 1.4em; }
        .document-reader ul { list-style: disc; padding-left: 1.5em; }
        .document-reader ol { list-style: decimal; padding-left: 1.5em; }
        .document-reader td, .document-reader th { border: 1px solid #cbd5e1; padding: .5em; }
        .document-reader img { max-width: 100%; height: auto; }
        .message { padding: 24px; text-align: center; color: #475569; }
        .message.error { color: #b91c1c; }
    </style>
</head>
<body>
    <header>
        <a href="/">← Drive</a>
        <h1 id="title">Se deschide documentul…</h1>
        <a id="download" href="#" hidden>Descarcă</a>
    </header>
    <main><div id="reader"><p class="message">Se deschide documentul…</p></div></main>

    <script src="/drive.js"></script>
    <script>
        (async () => {
            const reader = document.getElementById('reader');
            const fail = text => { reader.innerHTML = ''; const p = document.createElement('p'); p.className = 'message error'; p.textContent = text; reader.append(p); };
            const id = new URL(location.href).searchParams.get('document');
            if (!id) return fail('Lipsește documentul din adresă.');
            try {
                const item = await window.drive.item(id);
                document.title = item.name + ' — Drept UniBuc';
                document.getElementById('title').textContent = item.name;
                const download = document.getElementById('download');
                download.href = '/api/file/' + encodeURIComponent(item.id) + '?dl=1';
                download.hidden = false;
                if (!window.drive.documentType(item)) return fail('Acest format nu poate fi citit aici. Folosește „Descarcă”.');
                await window.drive.renderDocument(item, reader);
            } catch (error) {
                fail(error.status === 404 ? 'Documentul nu mai este disponibil sau așteaptă aprobarea administratorului.' : (error.message || 'Documentul nu a putut fi deschis.'));
            }
        })();
    </script>
</body>
</html>

# Cloudflare PAGES (varianta principală). Setări în proiectul Pages:
#   Build command: (gol)      Build output directory: public
# „name" trebuie să fie numele proiectului Pages din Cloudflare.
name = "drept-unibuc-drive"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

# Bucket-ul R2 unde stau fișierele. Creează-l în dashboard cu exact acest nume
# (sau schimbă bucket_name mai jos).
[[r2_buckets]]
binding = "FILES"
bucket_name = "drept-unibuc-files"

# NU pune parole aici. DATABASE_URL, ADMIN_PASSWORD și SESSION_SECRET se adaugă în Cloudflare,
# la Settings -> Variables and Secrets, ca „Secret".

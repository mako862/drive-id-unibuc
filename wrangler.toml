name = "drept-unibuc-drive"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

# Bucket-ul R2 unde stau fișierele. Creează-l în dashboard cu exact acest nume
# (sau schimbă bucket_name mai jos).
[[r2_buckets]]
binding = "FILES"
bucket_name = "drept-unibuc-files"

# NU pune parole aici. Variabilele secrete (DATABASE_URL, ADMIN_PASSWORD, SESSION_SECRET)
# se adaugă în Cloudflare, la Settings -> Variables and Secrets, ca „Secret".
